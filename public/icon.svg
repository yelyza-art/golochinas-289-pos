<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="candy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Candy Lollipop Spiral Graphic -->
  <circle cx="256" cy="210" r="95" fill="url(#candy)" />
  <path d="M256,115 A95,95 0 0,1 351,210 A47.5,47.5 0 0,1 256,210 A47.5,47.5 0 0,0 208.5,210" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  
  <!-- Lollipop Stick -->
  <path d="M256,305 L256,375" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  
  <!-- Shopping Bag / Store Tag Icon overlay -->
  <rect x="186" y="325" width="140" height="90" rx="16" fill="url(#gold)" />
  <path d="M226,325 C226,300 286,300 286,325" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <text x="256" y="378" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">POS 289</text>

  <!-- Title Bottom text -->
  <text x="256" y="465" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">GOLOCHINAS</text>
</svg>
